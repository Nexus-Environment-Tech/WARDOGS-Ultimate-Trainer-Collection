; MK12Customizer Configuration
; Based on MK12TTH's INI structure [citation:4]

[Settings]
iLogLevel = 2
bEnableConsoleWindow = false
bPauseOnStart = false

[Patches]
; Signature checks - required for loading modded .pak/.utoc/.ucas [citation:4]
bDisableSignatureCheck = true
bDisableChunkSigCheck = true
bDisableTOCSigCheck = true

[Hooks]
; FName hooking for asset swaps [citation:4]
bEnableFNameHook = true
; Pak loader hook for custom chunks
bEnablePakLoaderHook = true

[Features]
; Announcer voice swap [citation:4]
bEnableAnnouncerSwap = false
szAnnouncerName = Default

; Raiden lightning color [citation:9]
bEnableLightningCustomizer = false
szLightningColor = 0x00FF00

[Patterns]
; These patterns change with game updates
; Update when game patches [citation:4]
pSigCheck = 80 B9 ? ? ? ? 00 49 8B
pChunkSigCheck = 48 8B 05 ? ? ? ? 48 85 C0 74
pTOCSigCheck = 48 8B 0D ? ? ? ? 48 85 C9 74
pFNameToString = 48 89 5C 24 ? 48 89 74 24 ? 57 48 83 EC 20
